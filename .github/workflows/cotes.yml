name: Scraper Cotes betPawa

on:
  repository_dispatch:
    types: [run-cotes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Mise a jour des donnees
        run: python refresh.py

      - name: Sauvegarde si nouveaux matchs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Pas de changement"
          else
            git commit -m "MAJ donnees"
            git pull --rebase
            git push
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Run scraper 1X2
        continue-on-error: true
        env:
          NTFY_TOPIC_2: ${{ secrets.NTFY_TOPIC_2 }}
        run: python scraper2.py
